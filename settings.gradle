pluginManagement {
    repositories {
        mavenLocal()
        maven {
            url = uri("https://jitpack.io")
        }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.xuncorp.spw.workshop") {
                useModule("com.github.Moriafly.spw-workshop-api:spw-workshop-gradle-plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'SaltSteamPlugin'

