import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.kapt' version '2.3.0'
    id 'com.xuncorp.spw.workshop' version '0.1.0-dev21'
}

group = 'com.gg.SaltSteamPlugin'
version = '3.3.1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven {
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly 'net.jthink:jaudiotagger:3.0.1'
    compileOnly "com.github.Moriafly:spw-workshop-api:0.1.0-dev21"
    kapt "com.github.Moriafly:spw-workshop-api:0.1.0-dev21"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

spmod { config ->
    config.PluginClass = "com.gg.SaltSteamPlugin.MainPlugin"
    config.PluginId = "com.gg.SaltSteamPlugin"
    config.PluginName = "Steam 丰富状态扩展"
    config.PluginVersion = project.version.toString()
    config.PluginProvider = "GaodaGG"
    config.PluginOpenSourceUrl = "https://github.com/GaodaGG/SaltSteamPlugin"
    config.PluginDescription = "通过 Steam API 丰富 Salt Player 的状态信息"
    config.PluginHasConfig = true
}

tasks.named("jar") {
    archiveFileName = "plugin-${spmod.PluginId}-${spmod.PluginVersion}.jar"
}
